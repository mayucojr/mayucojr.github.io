name: Build and deploy site

# Runs every time something is saved to master (including saves from Pages CMS):
# optimizes photos, builds the article/curation pages, and publishes to GitHub Pages.
on:
  push:
    branches: [master]
  workflow_dispatch:   # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer save waits for the current one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build pages
        run: python scripts/build.py

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='scripts' --exclude='requirements.txt' \
            --exclude='README.md' --exclude='.pages.yml' --exclude='.gitignore' \
            --exclude='.DS_Store' \
            ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
